<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Message - CIY-26</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .message-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .message-container h1 {
            margin-top: 0;
            color: #111827;
        }

        .message-info {
            margin: 20px 0;
            line-height: 1.8;
        }

        .message-body {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            line-height: 1.7;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="message-container">

    <h1>
        <i class="fas fa-envelope-open-text"></i>
        View Message
    </h1>

    <div class="message-info">

        <p>
            <strong>Name:</strong>
            {{ message.name }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ message.email }}
        </p>

        <p>
            <strong>Subject:</strong>
            {{ message.subject }}
        </p>

        <p>
            <strong>Received:</strong>
            {{ message.created_at.strftime('%d %B %Y, %I:%M %p') }}
        </p>

    </div>

    <div class="message-body">

        <strong>Message:</strong>

        <p>
            {{ message.message }}
        </p>

    </div>

    <a href="/admin" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back to Admin
    </a>

</div>

</body>
</html>
